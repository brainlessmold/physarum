<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Physarum — zero neurons</title>
    <meta
      name="description"
      content="A brainless single cell that computes shortest paths and designs networks. Tero et al., Science 2010. The model runs live in this page."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Link previews. og:image has to be an absolute URL — relative paths are not
      resolved by most crawlers. Change the two og:url / og:image lines to the
      real domain once this is deployed, or the card renders blank.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Physarum" />
    <meta property="og:title" content="Zero neurons." />
    <meta
      property="og:description"
      content="One cell, no nervous system. It rebuilt the Tokyo rail network — and the model is solving in your browser right now."
    />
    <meta property="og:url" content="https://physarum.vercel.app/" />
    <meta property="og:image" content="https://physarum.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A network of tubes grown across thirty-six cities around Tokyo by the Physarum model."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@brainlessmold" />
    <meta name="twitter:title" content="Zero neurons." />
    <meta
      name="twitter:description"
      content="One cell, no nervous system. It rebuilt the Tokyo rail network — and the model is solving in your browser right now."
    />
    <meta name="twitter:image" content="https://physarum.vercel.app/og.png" />

    <meta name="theme-color" content="#0a0b09" />
